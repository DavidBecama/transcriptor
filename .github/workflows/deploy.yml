name: Deploy

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /app/reelscript
            # Downtime mínimo: NO `docker compose down`. `up -d --build` construye las
            # imágenes y recrea SOLO los servicios cambiados; si el build falla, los
            # contenedores viejos siguen vivos (la app no se cae).
            # `checkout -B prod origin/prod` = reset duro a origin/prod + RE-ENGANCHA HEAD
            # a la rama (self-healing: deja de heredar el detached-HEAD de deploys viejos
            # que hacían `git checkout <tag>`).
            git fetch origin
            git checkout -B prod origin/prod
            docker compose up -d --build
