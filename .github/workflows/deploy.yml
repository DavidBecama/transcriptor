name: Deploy

on:
  release:
    types: [published]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: root
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /app/reelscript
            # Downtime mínimo: NO `docker compose down`. Reset duro a origin/prod (mantiene
            # HEAD en la rama, sin detached) y `up -d --build` construye las imágenes y
            # recrea SOLO los servicios cambiados. Si el build falla, los contenedores
            # viejos siguen vivos (la app no se cae).
            git fetch origin
            git reset --hard origin/prod
            docker compose up -d --build
