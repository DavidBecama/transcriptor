services:
  redis:
    image: redis:7-alpine
    restart: always
    networks:
      - traefik-public

  # P2: rotación de logs con retención — el histórico sobrevive semanas, no hasta
  # el siguiente `up --build` (los contenedores se recrean en cada deploy, pero
  # los json-file rotados persisten en /var/lib/docker mientras viva el contenedor;
  # el tamaño acotado evita llenar disco). Aplica al recrear (próximo deploy).
  app:
    build: .
    restart: always
    env_file: .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    logging: &log-rotate
      driver: json-file
      options:
        max-size: "20m"
        max-file: "10"
    labels:
      - traefik.enable=true
      - traefik.http.routers.reelscript.rule=Host(`reelscript.net`) || Host(`www.reelscript.net`)
      - traefik.http.routers.reelscript.entrypoints=websecure
      - traefik.http.routers.reelscript.tls.certresolver=le
      - traefik.http.services.reelscript.loadbalancer.server.port=5555
    networks:
      - traefik-public

  worker:
    build: .
    restart: always
    env_file: .env
    environment:
      - PYTHONPATH=/app
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    command: celery -A tasks worker --loglevel=info --concurrency=4
    logging: *log-rotate
    networks:
      - traefik-public

  beat:
    build: .
    restart: always
    env_file: .env
    environment:
      - PYTHONPATH=/app
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis
    command: celery -A tasks beat --loglevel=info --schedule=/tmp/celerybeat-schedule
    logging: *log-rotate
    networks:
      - traefik-public

networks:
  traefik-public:
    external: true
